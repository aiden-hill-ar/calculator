<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shorcut icon" href="../svg/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Hanuman:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/calculator.css">
    <link rel="stylesheet" href="../styles/nav.css">
    <title>Calculator</title>
</head>
<body>
    <div class="infinity-title-container">
        <h1 class="infinity-title">Calculator, <span>Calculator,</span> Calculator, Calculator, Calculator, Calculator, Calculator, Calculator, Calculator, Calculator, </h1>
    </div>
    <nav>
        <div class="icon-holder" data-button="home">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
                <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            </svg>
        </div>
        <div class="selected" data-button="calculator">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <rect width="16" height="20" x="4" y="2" rx="2"/>
                <line x1="8" x2="16" y1="6" y2="6"/>
                <line x1="16" x2="16" y1="14" y2="18"/>
                <path d="M16 10h.01"/>
                <path d="M12 10h.01"/>
                <path d="M8 10h.01"/>
                <path d="M12 14h.01"/>
                <path d="M8 14h.01"/>
                <path d="M12 18h.01"/>
                <path d="M8 18h.01"/>
            </svg>
        </div>
    </nav>
    <div class="squiggly-line"></div>
    <section class="main">
        <div class="calculator">
            <div class="frame top">
                <section class="screen">
                    <p class="starting">O.S. Yappy Krappy</p>
                    <p class="input">Awaiting Input<span>:</span></p>
                </section>
            </div>
            <div class="frame hinge"></div>
            <div class="frame bottom">
                <section class="buttons">
                    <div class="num-button num0" data-num="0"><p>0</p></div>
                    <div class="num-button num1" data-num="1"><p>1</p></div>
                    <div class="num-button num2" data-num="2"><p>2</p></div>
                    <div class="num-button num3" data-num="3"><p>3</p></div>
                    <div class="num-button num4" data-num="4"><p>4</p></div>
                    <div class="num-button num5" data-num="5"><p>5</p></div>
                    <div class="num-button num6" data-num="6"><p>6</p></div>
                    <div class="num-button num7" data-num="7"><p>7</p></div>
                    <div class="num-button num8" data-num="8"><p>8</p></div>
                    <div class="num-button num9" data-num="9"><p>9</p></div>
                    <div class="num-button dot" data-num="."><p>.</p></div>

                    <div class="operator-button equals" data-num="="><p>=</p></div>
                    <div class="operator-button plus" data-num="+"><p>+</p></div>
                    <div class="operator-button minus" data-num="-"><p>-</p></div>
                    <div class="operator-button multiply" data-num="*"><p>X</p></div>
                    <div class="operator-button divide" data-num="/"><p>/</p></div>

                    <div class="special-button delete" data-num="delete">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
                            <g transform="translate(2.5,4)">
                                <path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/>
                                <path d="m12 9 6 6"/>
                                <path d="m18 9-6 6"/>
                            </g>
                        </svg>
                    </div>
                    <div class="special-button clear" data-num="clear"><p>AC</p></div>
                    <div class="special-button parenthesis" data-num="parenthesis"><p><span>(</span> <span>)</span></p></div>
                    <div class="special-button positive-negative" data-num="positive-negative"><p>+/-</p></div>
                </section>
            </div>
        </div>
    </section>
    <script src="../scripts/calculator.js"></script>
    <script src="../scripts/nav.js"></script>
</body>
</html>
