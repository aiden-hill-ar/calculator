<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Hanuman:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Calculator</title>
</head>
<body>
    <div class="infinity-title-container">
        <h1 class="infinity-title">Calculator, <span>Calculator,</span> Calculator, Calculator, Calculator, Calculator, Calculator, Calculator, Calculator, Calculator, </h1>
    </div>
    <div class="squiggly-line"></div>
    <section class="main">
        <div class="calculator">
            <section class="screen">
                <p>Awaiting Input<span class="blink">:</span></p>
            </section>
            <section class="buttons">
                <div class="num-button num0"><h1>0</h1></div>
                <div class="num-button num1"><h1>1</h1></div>
                <div class="num-button num2"><h1>2</h1></div>
                <div class="num-button num3"><h1>3</h1></div>
                <div class="num-button num4"><h1>4</h1></div>
                <div class="num-button num5"><h1>5</h1></div>
                <div class="num-button num6"><h1>6</h1></div>
                <div class="num-button num7"><h1>7</h1></div>
                <div class="num-button num8"><h1>8</h1></div>
                <div class="num-button num9"><h1>9</h1></div>
                <div class="num-button dot"><h1>.</h1></div>

                <div class="operator-button equals"><h1>=</h1></div>
                <div class="operator-button plus"><h1>+</h1></div>
                <div class="operator-button minus"><h1>-</h1></div>
                <div class="operator-button multiply"><h1>X</h1></div>
                <div class="operator-button divide"><h1>÷</h1></div>

                <div class="special-button delete"></div>
                <div class="special-button clear"><h1>AC</h1></div>
                <div class="special-button positive-negative"></div>
            </section>
        </div>
    </section>
    <script src="./script.js"></script>
</body>
</html>
